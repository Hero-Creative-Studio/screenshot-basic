<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>screenshot-basic</title>
    <style>
        html, body { margin: 0; background: transparent; }
        canvas { display: none; }
    </style>
</head>
<body>
<script>
const resourceName = GetParentResourceName();
const mimeTypes = new Map([['jpg', 'image/jpeg'], ['png', 'image/png'], ['webp', 'image/webp']]);

const glCanvas = document.createElement('canvas');
document.body.appendChild(glCanvas);
const gl = glCanvas.getContext('webgl');

function compile(type, src) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, src);
    gl.compileShader(shader);
    return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, `
    attribute vec2 pos;
    uniform float flipY;
    varying vec2 uv;
    void main() {
        uv = vec2((pos.x + 1.0) * 0.5, 0.5 - pos.y * 0.5 * flipY);
        gl_Position = vec4(pos, 0.0, 1.0);
    }`));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, `
    precision highp float;
    varying vec2 uv;
    uniform sampler2D tex;
    void main() {
        gl_FragColor = texture2D(tex, uv);
    }`));
gl.linkProgram(program);
gl.useProgram(program);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const posLoc = gl.getAttribLocation(program, 'pos');
gl.enableVertexAttribArray(posLoc);
gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

const gameTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, gameTex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array(3));
gl.uniform1i(gl.getUniformLocation(program, 'tex'), 0);
const flipLoc = gl.getUniformLocation(program, 'flipY');

function bindGameTexture() {
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.bindTexture(gl.TEXTURE_2D, gameTex);
    gl.texParameterf(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameterf(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    gl.texParameterf(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}

function drawGameFrame(framebuffer, flip, w, h) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    bindGameTexture();
    gl.uniform1f(flipLoc, flip);
    gl.viewport(0, 0, w, h);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

const targetTex = gl.createTexture();
const fbo = gl.createFramebuffer();
let targetW = 0, targetH = 0;

function readGameFrame(w, h) {
    if (w !== targetW || h !== targetH) {
        gl.bindTexture(gl.TEXTURE_2D, targetTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, targetTex, 0);
        targetW = w;
        targetH = h;
    }

    drawGameFrame(fbo, 1, w, h);

    const pixels = new Uint8ClampedArray(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    return pixels;
}

function isPlainObject(v) {
    return typeof v === 'object' && v !== null && !Array.isArray(v);
}

function screenshot(req) {
    const encoding = mimeTypes.has(req.encoding) ? req.encoding : 'jpg';
    const quality = typeof req.quality === 'number' ? req.quality : 0.92;
    const w = window.innerWidth, h = window.innerHeight;

    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').putImageData(new ImageData(readGameFrame(w, h), w, h), 0, 0);

    return new Promise(resolve => canvas.toBlob(blob => resolve([blob, `screenshot.${encoding}`]), mimeTypes.get(encoding), quality));
}

function record(req) {
    const fps = typeof req.fps === 'number' ? req.fps : 30;
    const bitrate = typeof req.bitrate === 'number' ? req.bitrate : 2500000;
    const scale = Math.min(1, 720 / window.innerHeight);
    const w = Math.round(window.innerWidth * scale), h = Math.round(window.innerHeight * scale);

    glCanvas.width = w;
    glCanvas.height = h;
    const track = new MediaStreamTrackGenerator({ kind: 'video' });
    const writer = track.writable.getWriter();
    const recorder = new MediaRecorder(new MediaStream([track]), { mimeType: 'video/webm', videoBitsPerSecond: bitrate });
    const chunks = [];
    const start = performance.now();
    let recording = true;
    let next = start;

    const draw = () => {
        if (!recording) {
            return;
        }

        const now = performance.now();
        if (now >= next) {
            next = Math.max(next + 1000 / fps, now);
            drawGameFrame(null, -1, w, h);
            writer.write(new VideoFrame(glCanvas, { timestamp: Math.round((now - start) * 1000) }));
        }

        requestAnimationFrame(draw);
    };

    return new Promise((resolve, reject) => {
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
            recording = false;
            writer.close();
            const blob = new Blob(chunks, { type: 'video/webm' });
            blob.size ? resolve([blob, 'video.webm']) : reject(new Error('recording failed'));
        };
        recorder.start();
        draw();
        setTimeout(() => recorder.stop(), req.duration * 1000);
    });
}

function readDataURL(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
    });
}

async function handle(req) {
    let result = '';

    try {
        const [blob, fileName] = await (req.video ? record(req) : screenshot(req));

        if (req.targetURL) {
            const form = new FormData();
            form.append(req.targetField, blob, fileName);

            const response = await fetch(req.targetURL, {
                method: 'POST',
                headers: isPlainObject(req.headers) ? req.headers : {},
                body: form
            });

            if (!response.ok) {
                throw new Error(`upload failed: HTTP ${response.status}`);
            }

            result = await response.text();
        } else {
            result = await readDataURL(blob);
        }
    } catch (err) {
        console.error('screenshot-basic:', err);
    }

    try {
        await fetch(`https://${resourceName}/screenshot_created`, {
            method: 'POST',
            body: JSON.stringify({ id: req.id, data: result })
        });
    } catch (err) {
        console.error('screenshot-basic: result callback failed:', err);
    }
}

window.addEventListener('message', event => {
    const req = event.data && event.data.request;
    if (req) {
        requestAnimationFrame(() => handle(req));
    }
});
</script>
</body>
</html>
